name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nexus_manga_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_manga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: nexus_manga_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Lint source code
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build NestJS
        run: npm run build
      - name: Run PostgreSQL migrations
        run: npm run migration:run
      - name: Verify migration re-run
        run: npm run migration:run
      - name: Test migration rollback
        run: |
          npm run migration:revert
          npm run migration:run
          - name: Verify mangas table
            run: |
          psql --version
          PGPASSWORD="$POSTGRES_PASSWORD" psql \
          -h "$POSTGRES_HOST" \
          -p "$POSTGRES_PORT" \
          -U "$POSTGRES_USER" \
          -d "$POSTGRES_DB" \
          -v ON_ERROR_STOP=1 \
          -c "SELECT COUNT(*) FROM public.tbl_mangas;"
      - name: Run unit tests
        run: npm test
      - name: Run e2e tests with PostgreSQL
        run: npm run test:e2e
